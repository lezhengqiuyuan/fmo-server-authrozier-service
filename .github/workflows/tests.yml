name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sas.sln

      - name: Build
        run: dotnet build Sas.sln -c Release --no-restore -warnaserror:NU1902,NU1903,NU1904

      - name: Audit dependencies
        shell: pwsh
        run: |
          $output = dotnet list src/Sas.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
              throw 'Dependency audit command failed'
          }
          if ($output -match 'following vulnerable packages') {
              throw 'Vulnerable dependencies detected'
          }

      - name: Unit tests
        run: dotnet test tests/Sas.Tests/Sas.Tests.csproj -c Release --no-build --filter "Category!=Integration"

      - name: Integration tests
        run: dotnet test tests/Sas.Tests/Sas.Tests.csproj -c Release --no-build --filter "Category=Integration"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Sas.sln -c Debug

      - name: Collect coverage
        run: |
          dotnet tool install dotnet-coverage --tool-path ./.tools
          ./.tools/dotnet-coverage collect \
            "dotnet test tests/Sas.Tests/Sas.Tests.csproj -c Debug --no-build" \
            -f cobertura -o coverage.xml

      - name: Enforce coverage threshold
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          # CLI interaction code (interactive wizard, admin/cluster prompts and
          # the program entry point) is validated manually; the gate measures
          # the protocol, trust, auth, logging and server layers.
          EXCLUDED_PREFIXES = ("Program", "Sas.Program", "Sas.Config", "Sas.Tests")

          root = ET.parse("coverage.xml").getroot()
          packages = [p.get("name", "") for p in root.iter("package")]
          print("coverage packages: " + ", ".join(packages))

          covered = 0
          valid = 0

          for cls in root.iter("class"):
              name = cls.get("name", "")
              if not name.startswith("Sas."):
                  continue
              if name.startswith(EXCLUDED_PREFIXES):
                  continue
              for line in cls.iter("line"):
                  valid += 1
                  if int(line.get("hits", "0")) > 0:
                      covered += 1

          if valid == 0:
              sys.exit("coverage gate failed: no Sas.* classes found in coverage.xml")

          rate = covered / valid
          print(f"core line coverage: {covered}/{valid} = {rate:.1%}")

          if rate < 0.75:
              sys.exit(f"coverage gate failed: {rate:.1%} < 75%")
          EOF
